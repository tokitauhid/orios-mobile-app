name: Build & Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inject Environment Variables
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            echo "$ENV_FILE" > .env
          else
            echo "EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL}" >> .env
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_ANON_KEY}" >> .env
          fi

      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build unsigned release / debug APK
        if: steps.signing.outputs.enabled != 'true'
        working-directory: android
        run: |
          ./gradlew assembleRelease -Dorg.gradle.java.home="$JAVA_HOME" || ./gradlew assembleDebug -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Locate compiled APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "❌ No APK found in build outputs!"
            exit 1
          fi
          echo "Found APK at: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Package Release APK
        id: release_apk
        run: |
          TAG="${GITHUB_REF_NAME}"
          ORIGINAL="${{ steps.apk.outputs.path }}"
          mkdir -p release
          OUTPUT_NAME="release/Orios-${TAG}.apk"
          cp "$ORIGINAL" "$OUTPUT_NAME"
          echo "path=$OUTPUT_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${CURRENT_TAG}$" | tail -n1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (\`%h\`)" --no-merges -n 20)
          else
            COMMITS=$(git log --pretty=format:"- %s (\`%h\`)" --no-merges "${PREV_TAG}..${CURRENT_TAG}")
          fi
          
          {
            echo "## 📱 Orios Mobile ${CURRENT_TAG}"
            echo ""
            echo "### What's Changed"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "---"
            echo "### Installation"
            echo "1. Download \`Orios-${CURRENT_TAG}.apk\` below."
            echo "2. Transfer or open on your Android device."
            echo "3. Follow the package installer prompts to install or update."
          } > changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: changelog.md
          files: ${{ steps.release_apk.outputs.path }}
